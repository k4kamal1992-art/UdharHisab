name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: কোড ডাউনলোড
        uses: actions/checkout@v4
      - name: প্রজেক্ট ফোল্ডার root-এ আনা
        run: |
          shopt -s dotglob
          if [ -d "DharHisab" ]; then
            mv DharHisab/* .
            rmdir DharHisab
          fi
          ls -la


      # ⭐ সরাসরি Gradle ইনস্টল — gradlew ফাইল লাগবে না!
      - name: Gradle সেটআপ
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Java সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ⭐ ./gradlew নয় — শুধু gradle
      - name: APK বিল্ড
         run: gradle assembleDebug --no-daemon
         working-directory: DharHisab
          
      - name: APK আপলোড
        uses: actions/upload-artifact@v4
        with:
          name: UdharHisab-APK
          path: app/build/outputs/apk/debug/app-debug.apk
