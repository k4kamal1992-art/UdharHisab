name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: কোড ডাউনলোড
        uses: actions/checkout@v4

      - name: ZIP আনজিপ ও ফাইল root-এ আনা
        run: |
          ls -la
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -1)
          echo "ZIP পাওয়া গেছে: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          # ⭐ সবচেয়ে গভীরের settings.gradle.kts খুঁজে তার ফোল্ডার বের করা
          PROJECT_DIR=(dirname"(dirname "(dirname"(find extracted -name "settings.gradle.kts" | head -1)")
          echo "প্রজেক্ট ফোল্ডার: $PROJECT_DIR"
          shopt -s dotglob
          mv "$PROJECT_DIR"/* .
          rm -rf extracted "$ZIP_FILE"
          # ⭐ gradle.properties ZIP-এ নেই — এখানেই বানানো
          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF
          echo "=== root-এ এখন যা আছে ==="
          ls -la

      - name: Gradle সেটআপ
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Java সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: APK বিল্ড
        run: gradle assembleDebug --no-daemon

      - name: APK আপলোড
        uses: actions/upload-artifact@v4
        with:
          name: UdharHisab-APK
          path: app/build/outputs/apk/debug/app-debug.apk
