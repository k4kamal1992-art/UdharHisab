name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: কোড ডাউনলোড
        uses: actions/checkout@v4

      - name: ZIP আনজিপ ও ফাইল সাজানো
        run: |
          ls -la
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -1)
          echo "ZIP pavua geche: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR=(dirname"(dirname "(dirname"(find extracted -name "settings.gradle.kts" | head -1)")
          echo "Project folder: $PROJECT_DIR"
          shopt -s dotglob
          mv "$PROJECT_DIR"/* .
          rm -rf extracted
          rm -f "$ZIP_FILE"
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "=== root e ekhon ja ache ==="
          ls -la

      - name: Gradle সেটআপ
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Java সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: APK বিল্ড
        run: gradle assembleDebug --no-daemon

      - name: APK আপলোড
        uses: actions/upload-artifact@v4
        with:
          name: UdharHisab-APK
          path: app/build/outputs/apk/debug/app-debug.apk
