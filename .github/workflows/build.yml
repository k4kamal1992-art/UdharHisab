name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: কোড ডাউনলোড
        uses: actions/checkout@v4

      - name: জিপ থেকে প্রজেক্ট বের করা
        run: |
          if [ -f "UdharHisabProject.zip" ]; then
            unzip -o UdharHisabProject.zip -d extracted
            shopt -s dotglob
            mv extracted/UdharHisabProject/DharHisab/* .
            rm -rf extracted UdharHisabProject.zip
          fi
          ls -la

      - name: Gradle সেটআপ
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Java সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: APK বিল্ড
        run: gradle assembleDebug --no-daemon

      - name: APK আপলোড
        uses: actions/upload-artifact@v4
        with:
          name: UdharHisab-APK
          path: app/build/outputs/apk/debug/app-debug.apk
