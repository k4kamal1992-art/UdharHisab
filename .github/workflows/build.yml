name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code download
        uses: actions/checkout@v4

      - name: Unzip and copy files to root
        run: |
          ls -la
          unzip -q UdharHisabProject.zip -d extracted
          cp -r extracted/UdharHisabProject/UdharHisab/. .
          rm -rf extracted
          rm -f UdharHisabProject.zip
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "kotlin.code.style=official" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "=== root files now ==="
          ls -la

      - name: Create missing resources
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          echo '<resources>' > app/src/main/res/values/themes.xml
          echo '<style name="Theme.Material3.DayNight.NoActionBar" parent="android:Theme.Material.Light.NoActionBar"/>' >> app/src/main/res/values/themes.xml
          echo '</resources>' >> app/src/main/res/values/themes.xml
          echo '<resources>' > app/src/main/res/values/colors.xml
          echo '<color name="ic_bg">#1B6E53</color>' >> app/src/main/res/values/colors.xml
          echo '</resources>' >> app/src/main/res/values/colors.xml
          echo '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          echo '<background android:drawable="@color/ic_bg"/>' >> app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          echo '<foreground android:drawable="@color/ic_bg"/>' >> app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          echo '</adaptive-icon>' >> app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          echo "resources created"

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Java setup
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UdharHisab-Release-APK
          path: app/build/outputs/apk/release/*.apk
