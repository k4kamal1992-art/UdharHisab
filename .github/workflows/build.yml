      - name: Create missing resources
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          echo '<resources>' > app/src/main/res/values/themes.xml
          echo '<style name="Theme.Material3.DayNight.NoActionBar" parent="android:Theme.Material.Light.NoActionBar"/>' >> app/src/main/res/values/themes.xml
          echo '</resources>' >> app/src/main/res/values/themes.xml
          echo '<resources>' > app/src/main/res/values/colors.xml
          echo '<color name="ic_bg">#1B6E53</color>' >> app/src/main/res/values/colors.xml
          echo '</resources>' >> app/src/main/res/values/colors.xml
          echo '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          echo '<background android:drawable="@color/ic_bg"/>' >> app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          echo '<foreground android:drawable="@color/ic_bg"/>' >> app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          echo '</adaptive-icon>' >> app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          echo "resources created"
